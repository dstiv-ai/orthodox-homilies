<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Audio Library · Orthodox Homilies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Design tokens copied verbatim from artifact/sunday-homilies-app.html (2026-08).
   When this concept is merged into the main app, delete this :root block — the
   app already defines them. Font stacks reference the same family names; the
   real 'GFS Didot' webfont is embedded in the main app as base64 and will be
   inherited there — here it falls back to Palatino/Georgia. */
:root {
  --page:#F4ECD9; --page-deep:#ECE0C6; --ink:#33261A; --ink-soft:#6E5C43;
  --porphyry:#5E1F3D; --porphyry-deep:#43152C; --gold:#96762A; --gold-bright:#C2A24B;
  --rule:#D9CAA6; --cover-ink:#F0E4C8; --scripture:#5E1F3D;
  --marian:#8A1E24; --marian-deep:#5C1216; --marian-scripture:#8A1E24;
  --tabor:#2A5674; --tabor-deep:#193B52; --tabor-scripture:#2A5674;
  --greek-font:'GFS Didot','Palatino Linotype',Palatino,Georgia,serif;
  --latin-font:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
}
@media (prefers-color-scheme: dark) {
  :root { --page:#1D1218; --page-deep:#150D11; --ink:#E7DCC4; --ink-soft:#A5947A;
    --porphyry:#9A4266; --porphyry-deep:#2B141F; --gold:#C9A43F; --gold-bright:#E0C06A;
    --rule:#412C38; --scripture:#DBA9C0;
    --marian:#C25B5B; --marian-deep:#2E1113; --marian-scripture:#E3AFA9;
    --tabor:#7FB0D4; --tabor-deep:#12222E; --tabor-scripture:#AFCFE6; }
}
:root[data-theme="light"] {
  --page:#F4ECD9; --page-deep:#ECE0C6; --ink:#33261A; --ink-soft:#6E5C43;
  --porphyry:#5E1F3D; --porphyry-deep:#43152C; --gold:#96762A; --gold-bright:#C2A24B;
  --rule:#D9CAA6; --scripture:#5E1F3D;
  --marian:#8A1E24; --marian-deep:#5C1216; --marian-scripture:#8A1E24;
  --tabor:#2A5674; --tabor-deep:#193B52; --tabor-scripture:#AFCFE6; }
:root[data-theme="dark"] {
  --page:#1D1218; --page-deep:#150D11; --ink:#E7DCC4; --ink-soft:#A5947A;
  --porphyry:#9A4266; --porphyry-deep:#2B141F; --gold:#C9A43F; --gold-bright:#E0C06A;
  --rule:#412C38; --scripture:#DBA9C0;
  --marian:#C25B5B; --marian-deep:#2E1113; --marian-scripture:#E3AFA9;
  --tabor:#7FB0D4; --tabor-deep:#12222E; --tabor-scripture:#AFCFE6; }

* { box-sizing:border-box; }
html,body { margin:0; padding:0; overflow-x:hidden; }
body { background:radial-gradient(1200px 500px at 50% -100px, var(--page) 60%, var(--page-deep)), var(--page-deep);
  color:var(--ink); font-family:var(--latin-font); line-height:1.62; -webkit-font-smoothing:antialiased;
  padding-bottom:var(--player-clear,0px); /* clear the docked player bar: bar height + iOS safe-area inset, measured in JS */ }
body.expanded { overflow:hidden; }
button { font-family:var(--latin-font); cursor:pointer; }
button:focus-visible, input:focus-visible { outline:2px solid var(--gold-bright); outline-offset:2px; }
svg { display:block; }

/* theme toggle — identical idiom to the main app */
.theme-toggle { position:fixed; top:14px; right:14px; z-index:30; width:40px; height:40px;
  display:flex; align-items:center; justify-content:center; border-radius:50%;
  border:1px solid var(--rule); background:color-mix(in srgb, var(--page) 88%, transparent);
  color:var(--ink-soft); backdrop-filter:blur(5px);
  box-shadow:0 6px 16px -10px rgba(40,10,25,.5); }
.theme-toggle:hover { border-color:var(--gold); }
.theme-toggle svg { width:18px; height:18px; }
.settings-btn { position:fixed; top:14px; right:62px; z-index:30; width:40px; height:40px;
  display:flex; align-items:center; justify-content:center; border-radius:50%;
  border:1px solid var(--rule); background:color-mix(in srgb, var(--page) 88%, transparent);
  color:var(--ink-soft); backdrop-filter:blur(5px);
  box-shadow:0 6px 16px -10px rgba(40,10,25,.5); }
.settings-btn:hover { border-color:var(--gold); }
.settings-btn svg { width:18px; height:18px; }
.settings-menu { position:fixed; top:60px; right:14px; z-index:30; min-width:220px;
  background:var(--page); border:1px solid var(--rule); border-radius:4px;
  box-shadow:0 14px 40px -14px rgba(40,10,25,.55); padding:8px; display:none; }
.settings-menu.open { display:block; }
.settings-menu .sm-title { margin:4px 10px 8px; font-size:11px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--gold); }
.settings-menu button { display:block; width:100%; text-align:left; background:none;
  border:0; border-radius:3px; padding:9px 10px; font-size:14px; color:var(--ink); }
.settings-menu button:hover { background:color-mix(in srgb, var(--gold) 12%, transparent); }

.codex { max-width:860px; margin:0 auto; padding:28px 16px 40px; }

/* cover — same idiom as the app library cover */
.cover { background:linear-gradient(160deg, var(--porphyry) 0%, var(--porphyry-deep) 85%);
  border-radius:6px; padding:10px; box-shadow:0 18px 50px -22px rgba(40,10,25,.55); }
.cover-frame { border:1px solid color-mix(in srgb, var(--gold-bright) 75%, transparent);
  outline:1px solid color-mix(in srgb, var(--gold-bright) 30%, transparent); outline-offset:4px;
  border-radius:3px; padding:40px 22px 36px; text-align:center; color:var(--cover-ink); position:relative; }
/* header ornament ported from concept B — same class names, same colour tokens */
.cover .tessera { position:absolute; top:0; left:0; right:0; height:7px;
  background:repeating-linear-gradient(90deg,
    var(--gold-bright) 0 8px, transparent 8px 16px,
    color-mix(in srgb, var(--gold) 70%, transparent) 16px 24px, transparent 24px 32px);
  opacity:.85; border-radius:3px 3px 0 0; }
.cover .cross { font-size:28px; color:var(--gold-bright); display:block; margin-bottom:10px; }
.cover h1 { margin:0 0 6px; font-family:var(--greek-font); font-weight:400;
  font-size:clamp(26px,5vw,44px); letter-spacing:.06em; color:var(--gold-bright); text-wrap:balance; }
.cover .en { margin:0 0 14px; font-style:italic; font-size:clamp(14px,2.2vw,18px); }
.cover .sub { margin:0 auto; max-width:40em; font-size:13px;
  color:color-mix(in srgb, var(--cover-ink) 70%, transparent); }
.eyebrow { margin:0 0 14px; font-size:11px; letter-spacing:.32em; text-transform:uppercase;
  color:color-mix(in srgb, var(--cover-ink) 72%, transparent); }

/* continue listening strip */
.continue { margin-top:18px; display:flex; align-items:center; gap:14px;
  background:color-mix(in srgb, var(--porphyry) 10%, var(--page));
  border:1px solid color-mix(in srgb, var(--porphyry) 35%, var(--rule));
  border-radius:4px; padding:14px 16px; }
.continue[hidden] { display:none; }
.continue .cl-art { flex:0 0 46px; width:46px; height:46px; border-radius:50%;
  background:linear-gradient(150deg, var(--porphyry), var(--porphyry-deep));
  border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; }
.continue .cl-art svg { width:18px; height:18px; color:var(--gold-bright); }
.continue .cl-meta { min-width:0; flex:1; }
.continue .cl-eyebrow { margin:0 0 2px; font-size:10.5px; letter-spacing:.26em;
  text-transform:uppercase; color:var(--gold); }
.continue .cl-title { margin:0; font-family:var(--greek-font); font-size:17px; color:var(--porphyry);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.continue .cl-resume { flex:0 0 auto; background:var(--porphyry); color:var(--cover-ink);
  border:1px solid var(--gold); border-radius:3px; padding:9px 14px; font-size:13.5px; letter-spacing:.04em; }
.continue .cl-resume:hover { background:var(--porphyry-deep); }

/* collection headings */
.cat-head { text-align:center; margin:52px auto 0; }
.cat-head h2 { margin:0 0 2px; font-family:var(--greek-font); font-weight:400;
  font-size:clamp(22px,3.4vw,30px); letter-spacing:.08em; color:var(--porphyry); }
.cat-head .cat-sub { margin:0; font-style:italic; color:var(--ink-soft); font-size:14px; }
.cat-head .cat-orn { color:var(--gold); font-size:12px; letter-spacing:.6em; margin:10px 0 0; }
.cat-head.pan h2 { color:var(--marian); }
.cat-head.tf h2 { color:var(--tabor); }

/* cards — same frame as the app's .card */
.shelf { margin:22px auto 0; display:grid; gap:12px; }
.card { display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:color-mix(in srgb, var(--page) 55%, transparent);
  border:1px solid var(--rule); border-radius:4px; padding:16px 18px; color:var(--ink); }
.card:hover { border-color:var(--gold); }
.card .play { flex:0 0 42px; width:42px; height:42px; border-radius:50%;
  border:1px solid var(--gold); background:linear-gradient(150deg, var(--porphyry), var(--porphyry-deep));
  color:var(--gold-bright); display:flex; align-items:center; justify-content:center; }
.card .play:hover { filter:brightness(1.12); }
.card .play svg { width:16px; height:16px; }
.card .c-body { min-width:0; flex:1; }
.card .c-title { margin:0 0 1px; font-family:var(--greek-font); font-size:19px; color:var(--porphyry);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card.pan .c-title { color:var(--marian); }
.card.tf .c-title { color:var(--tabor); }
.card .done-check { width:15px; height:15px; color:var(--gold-bright); flex:0 0 auto; }
.card .c-sub { margin:0 0 2px; font-style:italic; color:var(--ink-soft); font-size:13.5px; }
.card .c-meta { margin:0; font-size:12.5px; color:var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap; }
.card .badge { font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:1px 8px;
  border:1px solid var(--rule); border-radius:999px; color:var(--ink-soft); }
.card .badge.err { color:var(--marian); border-color:var(--marian); }
.card .pbar { margin-top:9px; height:3px; border-radius:2px;
  background:color-mix(in srgb, var(--rule) 70%, transparent); overflow:hidden; }
.card .pbar > i { display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--gold), var(--gold-bright)); }
.card.unavailable { opacity:.55; }
.card.unavailable .play { background:none; color:var(--ink-soft); border-color:var(--rule); cursor:default; }
.card.playing { border-color:var(--gold); }
.card.playing .c-title { color:var(--gold); }
.card .dur { flex:0 0 auto; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

/* ---- player bar ---- */
.player { position:fixed; left:0; right:0; bottom:0; z-index:25;
  background:color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter:blur(8px);
  border-top:1px solid var(--rule); box-shadow:0 -10px 30px -18px rgba(40,10,25,.5); }
.player[hidden] { display:none; }
.pbar-scrub { position:absolute; top:-2px; left:0; right:0; height:10px; cursor:pointer; touch-action:none; }
.pbar-scrub .track { position:absolute; top:4px; left:0; right:0; height:3px;
  background:color-mix(in srgb, var(--rule) 70%, transparent); }
.pbar-scrub .fill { position:absolute; top:4px; left:0; height:3px; width:0;
  background:linear-gradient(90deg, var(--gold), var(--gold-bright)); }
.pbar-scrub .thumb { position:absolute; top:2px; left:0; width:11px; height:11px; border-radius:50%;
  background:var(--gold-bright); border:1px solid var(--gold); transform:translateX(-50%); }
.player .p-row { max-width:860px; margin:0 auto; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));
  display:flex; align-items:center; gap:10px; }
.player .p-info { min-width:0; flex:1; cursor:pointer; background:none; border:0; text-align:left; padding:0; color:var(--ink); }
.player .p-title { margin:0; font-family:var(--greek-font); font-size:15.5px; color:var(--porphyry);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player .p-time { margin:0; font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.ctl { flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  border:1px solid transparent; background:none; color:var(--ink-soft); border-radius:50%; }
.ctl:hover { border-color:var(--rule); color:var(--ink); }
.ctl.skip { width:38px; height:38px; position:relative; }
.ctl.skip svg { width:19px; height:19px; }
.ctl.skip .lbl { position:absolute; bottom:3px; font-size:7.5px; letter-spacing:.02em; color:inherit; }
.ctl.main { width:46px; height:46px; border:1px solid var(--gold); border-radius:50%;
  background:linear-gradient(150deg, var(--porphyry), var(--porphyry-deep)); color:var(--gold-bright); }
.ctl.main svg { width:19px; height:19px; }
.ctl.main:hover { filter:brightness(1.12); color:var(--gold-bright); }
.ctl.pill { width:auto; height:32px; border-radius:999px; border:1px solid var(--rule);
  padding:0 10px; font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-soft); }
.ctl.pill:hover { border-color:var(--gold); color:var(--ink); }
.ctl.pill.active { border-color:var(--gold); color:var(--gold); }
.ctl.sleep svg { width:16px; height:16px; }

/* ---- expanded now-playing ---- */
.nowplaying { position:fixed; inset:0; z-index:26; display:none; flex-direction:column;
  background:radial-gradient(1000px 500px at 50% -120px, var(--page) 55%, var(--page-deep)), var(--page-deep); }
.nowplaying.open { display:flex; }
.np-inner { flex:1; min-height:0; max-width:520px; width:100%; margin:0 auto; padding:18px 22px calc(20px + env(safe-area-inset-bottom,0));
  display:flex; flex-direction:column; overflow-y:auto; }
.np-collapse { align-self:flex-start; width:40px; height:40px; border-radius:50%;
  border:1px solid var(--rule); background:none; color:var(--ink-soft); display:flex;
  align-items:center; justify-content:center; }
.np-collapse:hover { border-color:var(--gold); }
.np-collapse svg { width:17px; height:17px; }
.np-art { margin:26px auto 0; width:min(62vw,240px); aspect-ratio:1; border-radius:6px;
  background:linear-gradient(160deg, var(--porphyry) 0%, var(--porphyry-deep) 85%);
  border:1px solid color-mix(in srgb, var(--gold-bright) 75%, transparent);
  outline:1px solid color-mix(in srgb, var(--gold-bright) 30%, transparent); outline-offset:5px;
  box-shadow:0 18px 50px -22px rgba(40,10,25,.55); position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; }
.np-art .tessera { position:absolute; top:0; left:0; right:0; height:6px;
  background:repeating-linear-gradient(90deg, var(--gold-bright) 0 9px, transparent 9px 12px,
  color-mix(in srgb, var(--gold-bright) 55%, transparent) 12px 21px, transparent 21px 24px); opacity:.85; }
.np-art svg { width:52px; height:52px; color:var(--gold-bright); opacity:.9; }
.np-title { margin:26px 0 4px; text-align:center; font-family:var(--greek-font); font-weight:400;
  font-size:clamp(20px,5vw,26px); letter-spacing:.05em; color:var(--porphyry); }
.np-sub { margin:0; text-align:center; font-style:italic; color:var(--ink-soft); font-size:14px; }
.np-times { display:flex; justify-content:space-between; margin:22px 4px 4px;
  font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.np-scrub { position:relative; height:22px; cursor:pointer; touch-action:none; margin:0 -2px; }
.np-scrub .track { position:absolute; top:10px; left:2px; right:2px; height:3px; border-radius:2px;
  background:color-mix(in srgb, var(--rule) 70%, transparent); }
.np-scrub .fill { position:absolute; top:10px; left:2px; height:3px; border-radius:2px; width:0;
  background:linear-gradient(90deg, var(--gold), var(--gold-bright)); }
.np-scrub .thumb { position:absolute; top:6px; left:0; width:13px; height:13px; border-radius:50%;
  background:var(--gold-bright); border:1px solid var(--gold); transform:translateX(-50%); }
.np-controls { display:flex; align-items:center; justify-content:center; gap:18px; margin-top:16px; }
.np-controls .ctl.skip { width:52px; height:52px; }
.np-controls .ctl.skip svg { width:24px; height:24px; }
.np-controls .ctl.skip .lbl { bottom:7px; font-size:8.5px; }
.np-controls .ctl.main { width:68px; height:68px; }
.np-controls .ctl.main svg { width:26px; height:26px; }
.np-extras { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:20px; }
.sleep-menu { position:relative; }
.sleep-pop { position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  background:var(--page); border:1px solid var(--rule); border-radius:4px; padding:6px;
  box-shadow:0 14px 40px -14px rgba(40,10,25,.55); display:none; min-width:150px; }
.sleep-pop.open { display:block; }
.sleep-pop button { display:block; width:100%; text-align:left; background:none; border:0;
  border-radius:3px; padding:8px 10px; font-size:13.5px; color:var(--ink); white-space:nowrap; }
.sleep-pop button:hover { background:color-mix(in srgb, var(--gold) 12%, transparent); }
.sleep-pop button.sel { color:var(--gold); }

@media (max-width:480px) {
  .player .p-row { gap:6px; padding-left:10px; padding-right:10px; }
  .ctl.skip { width:34px; height:34px; }
  .ctl.main { width:42px; height:42px; }
  .card { padding:14px 14px; }
  .cover-frame { padding:32px 14px 28px; }
  .continue { flex-wrap:wrap; }
  .continue .cl-resume { width:100%; }
}
</style>

<body>

<button id="settingsBtn" class="settings-btn" type="button" aria-label="Settings" title="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"></button>

<div id="settingsMenu" class="settings-menu" role="menu" aria-label="Settings">
  <p class="sm-title">Settings</p>
  <button id="clearHistory" type="button">Clear listening history</button>
</div>

<div class="codex">

  <header class="cover">
    <div class="cover-frame">
      <div class="tessera" aria-hidden="true"></div>
      <span class="cross" aria-hidden="true">☩</span>
      <p class="eyebrow">Orthodox Homilies · ΑΚΟΥΣΜΑΤΑ</p>
      <h1>ΒΙΒΛΙΟΘΗΚΗ ΗΧΟΥ</h1>
      <p class="en">Audio Library</p>
      <p class="sub">Listen to the Sunday homilies, Chrysostom on Matthew, the Life of St&nbsp;Andrew, and the feasts of the Theotokos and the Transfiguration — with progress remembered across sessions.</p>
    </div>
  </header>

  <div id="continue" class="continue" hidden>
    <span class="cl-art" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </span>
    <div class="cl-meta">
      <p class="cl-eyebrow">Continue listening</p>
      <p class="cl-title" id="continueTitle"></p>
    </div>
    <button id="continueResume" class="cl-resume" type="button">Resume</button>
  </div>

  <div id="library"></div>

</div>

<!-- docked player bar -->
<div id="player" class="player" hidden>
  <div id="barScrub" class="pbar-scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
    <div class="track"></div><div class="fill" id="barFill"></div><div class="thumb" id="barThumb"></div>
  </div>
  <div class="p-row">
    <button id="playerInfo" class="p-info" type="button" aria-label="Expand now playing">
      <p class="p-title" id="playerTitle"></p>
      <p class="p-time" id="playerTime">0:00 / 0:00</p>
    </button>
    <button id="barSpeed" class="ctl pill" type="button" aria-label="Playback speed" title="Playback speed">1&times;</button>
    <button id="barBack" class="ctl skip" type="button" aria-label="Back 15 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">15</span>
    </button>
    <button id="barPlay" class="ctl main" type="button" aria-label="Play or pause"></button>
    <button id="barFwd" class="ctl skip" type="button" aria-label="Forward 30 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl">30</span>
    </button>
    <button id="barSleep" class="ctl skip sleep" type="button" aria-label="Sleep timer" title="Sleep timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span class="lbl" id="barSleepLbl"></span>
    </button>
  </div>
</div>

<!-- expanded now playing -->
<div id="nowplaying" class="nowplaying" role="dialog" aria-modal="true" aria-label="Now playing">
  <div class="np-inner">
    <button id="npCollapse" class="np-collapse" type="button" aria-label="Collapse now playing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="np-art"><span class="tessera"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M7 8h10M9.5 3h5M8 21h8"/></svg>
    </div>
    <h2 class="np-title" id="npTitle"></h2>
    <p class="np-sub" id="npSub"></p>
    <div class="np-times"><span id="npElapsed">0:00</span><span id="npRemain">-0:00</span></div>
    <div id="npScrub" class="np-scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="track"></div><div class="fill" id="npFill"></div><div class="thumb" id="npThumb"></div>
    </div>
    <div class="np-controls">
      <button id="npBack" class="ctl skip" type="button" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">15</span>
      </button>
      <button id="npPlay" class="ctl main" type="button" aria-label="Play or pause"></button>
      <button id="npFwd" class="ctl skip" type="button" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="lbl">30</span>
      </button>
    </div>
    <div class="np-extras">
      <button id="npSpeed" class="ctl pill" type="button" aria-label="Playback speed">1&times;</button>
      <div class="sleep-menu">
        <button id="npSleep" class="ctl pill" type="button" aria-label="Sleep timer">Sleep</button>
        <div id="sleepPop" class="sleep-pop" role="menu" aria-label="Sleep timer">
          <button type="button" data-min="15">15 minutes</button>
          <button type="button" data-min="30">30 minutes</button>
          <button type="button" data-min="45">45 minutes</button>
          <button type="button" data-min="end">End of chapter</button>
          <button type="button" data-min="off">Off</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ================= data =================
   Titles are the real first headings of the source files in this repo.
   Durations are placeholder estimates until the recordings exist.
   MiniMax-generated audio goes here — set each item's audioUrl. */
var LIBRARY = [
  { group:'Sunday Homilies', groupClass:'', items:[
    { id:'sun-2026-08-02-mt',  title:'Homily 50 on Matthew',            sub:'St John Chrysostom · 9th Sunday of Matthew, 2 Aug 2026',      dur:34*60, audioUrl:null, source:'content/2026-08-02/homily-50-aligned.md' },
    { id:'sun-2026-08-02-cor', title:'Homily 9 on First Corinthians',   sub:'St John Chrysostom · 9th Sunday of Matthew, 2 Aug 2026',      dur:28*60, audioUrl:null, source:'content/2026-08-02/homily-9-aligned.md' },
    { id:'sun-2026-08-09-cor', title:'Homily 13 on First Corinthians',  sub:'St John Chrysostom · Sunday after the Transfiguration, 9 Aug 2026', dur:31*60, audioUrl:null, source:'content/2026-08-09/homily-13-aligned.md' },
    { id:'sun-2026-08-09-mt',  title:'Homily 57 on Matthew',            sub:'St John Chrysostom · Sunday after the Transfiguration, 9 Aug 2026', dur:33*60, audioUrl:null, source:'content/2026-08-09/homily-57-aligned.md' }
  ]},
  { group:'St John Chrysostom on Matthew', groupClass:'', items:[
    { id:'mt-homily-15', title:'Homily 15 on Matthew', sub:'Matt. V. 13–16 · The Light of the World',        dur:38*60, audioUrl:null, source:'homilies/homily-15-matthew-5-13-16.md' },
    { id:'mt-homily-20', title:'Homily 20 on Matthew', sub:'Matt. VI. 16–21 · On Fasting and Treasure',      dur:36*60, audioUrl:null, source:'homilies/homily-20-matthew-6-16-21.md' },
    { id:'mt-homily-21', title:'Homily 21 on Matthew', sub:'Matt. VI. 24–27 · No Man Can Serve Two Masters', dur:37*60, audioUrl:null, source:'homilies/homily-21-matthew-6-24-27.md' },
    { id:'mt-homily-26', title:'Homily 26 on Matthew', sub:'Matt. VIII. 5–13 · The Centurion\u2019s Servant', dur:40*60, audioUrl:null, source:'homilies/homily-26-matthew-8-5-13.md' },
    { id:'mt-homily-28', title:'Homily 28 on Matthew', sub:'Matt. VIII. 23–34 · The Storm on the Sea',       dur:39*60, audioUrl:null, source:'homilies/homily-28-matthew-8-23-34.md' },
    { id:'mt-homily-50', title:'Homily 50 on Matthew', sub:'Matt. XIV. 23–36 · Christ Walking on the Sea',   dur:34*60, audioUrl:null, source:'homilies/homily-50-matthew-14-23-36.md' }
  ]},
  { group:'The Life of St Andrew the Fool', groupClass:'', items:[
    // real sample recording — plays from the repo
    { id:'andrew-ch1', title:'Chapter One',   sub:'The Life of Saint Andrew the Fool for Christ', dur:548, audioUrl:'audio/andrew-chapter-01.mp3', source:'content/andrew/chapter-01.md' },
    { id:'andrew-ch2', title:'Chapter Two',   sub:'The Life of Saint Andrew the Fool for Christ', dur:912, audioUrl:'audio/andrew-chapter-02.mp3', source:'content/andrew/chapter-02.md' },
    { id:'andrew-ch3', title:'Chapter Three', sub:'The Life of Saint Andrew the Fool for Christ', dur:986, audioUrl:'audio/andrew-chapter-03.mp3', source:'content/andrew/chapter-03.md' },
    { id:'andrew-ch4', title:'Chapter Four',  sub:'The Life of Saint Andrew the Fool for Christ', dur:868, audioUrl:'audio/andrew-chapter-04.mp3', source:'content/andrew/chapter-04.md' },
    { id:'andrew-ch5', title:'Chapter Five', sub:'The Life of Saint Andrew the Fool for Christ', dur:1041, audioUrl:'audio/andrew-chapter-05.mp3', source:'content/andrew/chapter-05.md' }
  ]},
  { group:'Feasts of the Theotokos & the Transfiguration', groupClass:'', items:[
    { id:'pan-damascus-1', title:'First Homily on the Dormition',            sub:'St John of Damascus',                    dur:29*60, audioUrl:null, groupClass:'pan', source:'content/panagia/damascus-1-dormition.md' },
    { id:'pan-ephraim',    title:'Prayer to the Panagia',                    sub:'St Ephraim the Syrian',                  dur:9*60,  audioUrl:null, groupClass:'pan', source:'content/panagia/ephraim-prayer.md' },
    { id:'pan-intro',      title:'Preparing for the Feast of the Dormition', sub:'Ὁ Δεκαπενταύγουστος',                    dur:12*60, audioUrl:null, groupClass:'pan', source:'content/panagia/intro-dekapentavgoustos.md' },
    { id:'pan-palamas-37', title:'Homily 37, On the Dormition',              sub:'St Gregory Palamas',                     dur:32*60, audioUrl:null, groupClass:'pan', source:'content/panagia/palamas-37-dormition.md' },
    { id:'pan-philaret',   title:'Sermon for the Day of the Dormition (1832)', sub:'Philaret of Moscow',                   dur:21*60, audioUrl:null, groupClass:'pan', source:'content/panagia/philaret-dormition.md' },
    { id:'tf-chrysostom-56', title:'Homily 56 on Matthew',                   sub:'St John Chrysostom · On the Transfiguration', dur:35*60, audioUrl:null, groupClass:'tf', source:'content/transfig/chrysostom-56.md' },
    { id:'tf-ephraim',     title:'Sermon on the Transfiguration',            sub:'St Ephraim the Syrian',                  dur:26*60, audioUrl:null, groupClass:'tf', source:'content/transfig/ephraim-transfig.md' }
  ]}
];

/* ================= storage ================= */
var STORE_KEY = 'orthodox-audio-progress';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}
var store = loadStore(); // id -> { pos, dur, done, last }

function findItem(id) {
  for (var g = 0; g < LIBRARY.length; g++)
    for (var i = 0; i < LIBRARY[g].items.length; i++)
      if (LIBRARY[g].items[i].id === id) return LIBRARY[g].items[i];
  return null;
}

/* ================= theme toggle (same wiring as the main app) ================= */
function pref(k, d) { try { return localStorage.getItem('sh-' + k) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('sh-' + k, v); } catch (e) {} }
var themeToggle = document.getElementById('themeToggle');
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
function effectiveTheme() {
  var attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'light' || attr === 'dark') return attr;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  catch (e) { return 'light'; }
}
function updateThemeGlyph() {
  themeToggle.innerHTML = effectiveTheme() === 'dark' ? SUN : MOON;
}
(function () {
  var stored = pref('theme', '');
  if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
  updateThemeGlyph();
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      var p = pref('theme', '');
      if (p !== 'light' && p !== 'dark') updateThemeGlyph();
    });
  } catch (e) {}
})();
themeToggle.addEventListener('click', function () {
  var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  save('theme', next);
  updateThemeGlyph();
});

/* ================= svg icons ================= */
var ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
var ICON_CHECK = '<svg class="done-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Finished"><path d="M4.5 12.5l5 5 10-11"/></svg>';

/* ================= render library ================= */
function fmtDur(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h) return h + ' hr ' + (m % 60) + ' min';
  return m + ' min';
}
function fmtClock(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), sec = s % 60, h = Math.floor(m / 60);
  if (h) return h + ':' + String(m % 60).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  return m + ':' + String(sec).padStart(2, '0');
}

var libraryEl = document.getElementById('library');
var cardEls = {}; // id -> { card, fill, badge }

LIBRARY.forEach(function (g) {
  var head = document.createElement('div');
  head.className = 'cat-head' + (g.group === 'Feasts of the Theotokos & the Transfiguration' ? '' : '');
  head.innerHTML = '<h2></h2><p class="cat-sub"></p><p class="cat-orn">·&nbsp;·&nbsp;·</p>';
  head.querySelector('h2').textContent = g.group;
  var subs = {
    'Sunday Homilies':'Read at the ambon each Lord\u2019s Day',
    'St John Chrysostom on Matthew':'From the ninety homilies on the Gospel',
    'The Life of St Andrew the Fool':'The vita of the holy fool for Christ',
    'Feasts of the Theotokos & the Transfiguration':'For the feasts of August'
  };
  head.querySelector('.cat-sub').textContent = subs[g.group] || '';
  libraryEl.appendChild(head);

  var shelf = document.createElement('div');
  shelf.className = 'shelf';
  g.items.forEach(function (it) {
    var cls = it.groupClass || g.groupClass || '';
    var card = document.createElement('div');
    card.className = 'card' + (cls ? ' ' + cls : '');
    card.innerHTML =
      '<button class="play" type="button" aria-label="Play"></button>' +
      '<div class="c-body">' +
        '<p class="c-title"><span class="t"></span><span class="check-slot"></span></p>' +
        '<p class="c-sub"></p>' +
        '<p class="c-meta"><span class="badge-slot"></span></p>' +
        '<div class="pbar" aria-hidden="true"><i></i></div>' +
      '</div><span class="dur"></span>';
    card.querySelector('.t').textContent = it.title;
    card.querySelector('.c-sub').textContent = it.sub;
    card.querySelector('.dur').textContent = fmtDur(it.dur);
    var playBtn = card.querySelector('.play');
    playBtn.innerHTML = ICON_PLAY;
    cardEls[it.id] = { card: card, fill: card.querySelector('.pbar > i'),
      badge: card.querySelector('.badge-slot'), check: card.querySelector('.check-slot'),
      playBtn: playBtn };
    if (!it.audioUrl) {
      card.classList.add('unavailable');
      cardEls[it.id].badge.innerHTML = '<span class="badge">Not yet recorded</span>';
      playBtn.setAttribute('aria-disabled', 'true');
      playBtn.tabIndex = -1;
    } else {
      playBtn.addEventListener('click', function () { playItem(it.id); });
    }
    shelf.appendChild(card);
  });
  libraryEl.appendChild(shelf);
});

function refreshCard(id) {
  var el = cardEls[id], rec = store[id];
  if (!el) return;
  var pct = rec && rec.dur ? Math.min(100, rec.pos / rec.dur * 100) : 0;
  el.fill.style.width = pct + '%';
  el.check.innerHTML = rec && rec.done ? ICON_CHECK : '';
  var it = findItem(id);
  if (it && it.audioUrl && !it._failed && !(rec && rec.done)) {
    el.badge.innerHTML = '';
  }
}

Object.keys(cardEls).forEach(refreshCard);

/* ================= player state ================= */
var audio = new Audio();
audio.preload = 'metadata';
var current = null;         // item id
var lastSave = 0;
var SPEEDS = [0.75, 1, 1.25, 1.5, 2];
var speedIdx = 1;
var sleepTimer = null;      // timeout id
var sleepEndOfChapter = false;
var sleepDeadline = 0;

var playerEl = document.getElementById('player');
var playerTitle = document.getElementById('playerTitle');
var playerTime = document.getElementById('playerTime');
var barFill = document.getElementById('barFill');
var barThumb = document.getElementById('barThumb');
var barPlay = document.getElementById('barPlay');
var npEl = document.getElementById('nowplaying');
var npTitle = document.getElementById('npTitle');
var npSub = document.getElementById('npSub');
var npElapsed = document.getElementById('npElapsed');
var npRemain = document.getElementById('npRemain');
var npFill = document.getElementById('npFill');
var npThumb = document.getElementById('npThumb');
var npPlay = document.getElementById('npPlay');
var barSleepLbl = document.getElementById('barSleepLbl');

barPlay.innerHTML = ICON_PLAY;
npPlay.innerHTML = ICON_PLAY;

/* Keep page bottom padding equal to the player bar height (its own padding
   already includes the iOS safe-area inset), and zero while it is hidden. */
function updatePlayerClear() {
  var h = playerEl.hidden ? 0 : playerEl.offsetHeight;
  document.documentElement.style.setProperty('--player-clear', h + 'px');
}
window.addEventListener('resize', updatePlayerClear);
updatePlayerClear();

function recordPosition() {
  if (!current) return;
  var rec = store[current] || {};
  rec.pos = audio.currentTime || 0;
  rec.dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (findItem(current).dur);
  rec.last = Date.now();
  store[current] = rec;
  saveStore(store);
  refreshCard(current);
}

function markDone(id) {
  var rec = store[id] || {};
  rec.pos = 0;
  rec.dur = rec.dur || findItem(id).dur;
  rec.done = true;
  rec.last = Date.now();
  store[id] = rec;
  saveStore(store);
  refreshCard(id);
}

function updateUI() {
  if (!current) return;
  var it = findItem(current);
  var dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : it.dur;
  var t = audio.currentTime || 0;
  var pct = dur ? Math.min(100, t / dur * 100) : 0;
  playerTime.textContent = fmtClock(t) + ' / ' + fmtClock(dur);
  barFill.style.width = pct + '%';
  barThumb.style.left = pct + '%';
  npFill.style.width = pct + '%';
  npThumb.style.left = pct + '%';
  npElapsed.textContent = fmtClock(t);
  npRemain.textContent = '-' + fmtClock(dur - t);
  document.getElementById('barScrub').setAttribute('aria-valuenow', Math.round(pct));
  document.getElementById('npScrub').setAttribute('aria-valuenow', Math.round(pct));
  var playing = !audio.paused && !audio.ended;
  barPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  npPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  Object.keys(cardEls).forEach(function (id) {
    cardEls[id].card.classList.toggle('playing', id === current && playing);
  });
  if (current && cardEls[current]) cardEls[current].fill.style.width = pct + '%';
}

function playItem(id) {
  var it = findItem(id);
  if (!it || !it.audioUrl) return;
  if (current === id) { togglePlay(); return; }
  if (current) recordPosition();
  current = id;
  var rec = store[id];
  var resume = rec && !rec.done && rec.pos > 1 ? rec.pos : 0; // finished items restart at 0
  audio.src = it.audioUrl;
  audio.playbackRate = SPEEDS[speedIdx];
  audio.currentTime = 0;
  var seekOnMeta = function () {
    if (resume > 0 && resume < (audio.duration || Infinity) - 1) audio.currentTime = resume;
    audio.removeEventListener('loadedmetadata', seekOnMeta);
  };
  audio.addEventListener('loadedmetadata', seekOnMeta);
  playerTitle.textContent = it.title;
  npTitle.textContent = it.title;
  npSub.textContent = it.sub;
  playerEl.hidden = false;
  updatePlayerClear();
  Object.keys(cardEls).forEach(function (cid) {
    cardEls[cid].playBtn.innerHTML = cid === current ? ICON_PAUSE : ICON_PLAY;
  });
  var p = audio.play();
  if (p && p.catch) p.catch(function () { /* handled by 'error' listener or user gesture needed */ });
  updateUI();
  updateContinue();
}

function togglePlay() {
  if (!current) return;
  if (audio.paused || audio.ended) {
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  } else {
    audio.pause();
  }
}

audio.addEventListener('play', function () {
  if (current && cardEls[current]) cardEls[current].playBtn.innerHTML = ICON_PAUSE;
  updateUI();
});
audio.addEventListener('pause', function () {
  recordPosition();
  if (current && cardEls[current]) cardEls[current].playBtn.innerHTML = ICON_PLAY;
  updateUI();
});
audio.addEventListener('timeupdate', function () {
  updateUI();
  var now = Date.now();
  if (!audio.paused && now - lastSave > 5000) { lastSave = now; recordPosition(); }
  var rec = current && store[current];
  var dur = audio.duration;
  if (current && isFinite(dur) && dur > 0 && audio.currentTime / dur > 0.97 && !(rec && rec.done)) {
    markDone(current);
    if (sleepEndOfChapter) { clearSleep(); audio.pause(); }
  }
});
audio.addEventListener('loadedmetadata', updateUI);
audio.addEventListener('ratechange', updateUI);
audio.addEventListener('ended', function () {
  if (current) markDone(current);
  if (sleepEndOfChapter) clearSleep();
  updateUI();
});
audio.addEventListener('error', function () {
  // missing / 404 / decode failure — show on the card, never throw
  if (!current) return;
  var it = findItem(current);
  it._failed = true;
  var el = cardEls[current];
  el.card.classList.add('unavailable');
  el.badge.innerHTML = '<span class="badge err">Audio unavailable</span>';
  el.playBtn.innerHTML = ICON_PLAY;
  playerEl.hidden = true;
  updatePlayerClear();
  document.body.classList.remove('expanded');
  npEl.classList.remove('open');
  current = null;
  updateContinue();
});

window.addEventListener('beforeunload', recordPosition);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') recordPosition();
});

/* ================= continue listening ================= */
var continueEl = document.getElementById('continue');
var continueTitle = document.getElementById('continueTitle');
var continueResume = document.getElementById('continueResume');
var continueId = null;

function updateContinue() {
  var best = null;
  Object.keys(store).forEach(function (id) {
    var rec = store[id];
    if (!rec.done && rec.pos > 1 && findItem(id) && findItem(id).audioUrl && !findItem(id)._failed) {
      if (!best || rec.last > store[best].last) best = id;
    }
  });
  continueId = best;
  if (!best) { continueEl.hidden = true; return; }
  var it = findItem(best), rec = store[best];
  continueTitle.textContent = it.title;
  continueResume.textContent = 'Resume at ' + fmtClock(rec.pos);
  continueEl.hidden = false;
}
continueResume.addEventListener('click', function () {
  if (continueId) playItem(continueId);
});
updateContinue();

/* ================= controls ================= */
barPlay.addEventListener('click', togglePlay);
npPlay.addEventListener('click', togglePlay);
function skip(d) {
  if (!current) return;
  audio.currentTime = Math.min(Math.max(0, audio.currentTime + d), audio.duration || Infinity);
  recordPosition();
  updateUI();
}
document.getElementById('barBack').addEventListener('click', function () { skip(-15); });
document.getElementById('npBack').addEventListener('click', function () { skip(-15); });
document.getElementById('barFwd').addEventListener('click', function () { skip(30); });
document.getElementById('npFwd').addEventListener('click', function () { skip(30); });

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  var label = String(SPEEDS[speedIdx]).replace(/\.0$/, '') + '\u00d7';
  document.getElementById('barSpeed').innerHTML = label;
  document.getElementById('npSpeed').textContent = label;
}
document.getElementById('barSpeed').addEventListener('click', cycleSpeed);
document.getElementById('npSpeed').addEventListener('click', cycleSpeed);

/* sleep timer */
var sleepPop = document.getElementById('sleepPop');
function clearSleep() {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  sleepEndOfChapter = false;
  sleepDeadline = 0;
  barSleepLbl.textContent = '';
  document.getElementById('barSleep').classList.remove('active');
  document.getElementById('npSleep').textContent = 'Sleep';
  sleepPop.querySelectorAll('button').forEach(function (b) { b.classList.remove('sel'); });
}
function setSleep(min, btn) {
  clearSleep();
  if (min === 'off') return;
  btn.classList.add('sel');
  if (min === 'end') {
    sleepEndOfChapter = true;
    barSleepLbl.textContent = 'ch';
    document.getElementById('npSleep').textContent = 'End of chapter';
  } else {
    sleepDeadline = Date.now() + min * 60000;
    sleepTimer = setTimeout(function () { clearSleep(); audio.pause(); }, min * 60000);
    barSleepLbl.textContent = min + 'm';
    document.getElementById('npSleep').textContent = 'Sleep ' + min + 'm';
  }
  document.getElementById('barSleep').classList.add('active');
}
sleepPop.querySelectorAll('button').forEach(function (b) {
  b.addEventListener('click', function () {
    var v = b.getAttribute('data-min');
    setSleep(v === 'end' ? 'end' : v === 'off' ? 'off' : parseInt(v, 10), b);
    sleepPop.classList.remove('open');
  });
});
document.getElementById('barSleep').addEventListener('click', function (e) {
  // the sleep options live in the expanded view — open it and show the menu
  e.stopPropagation();
  openNowPlaying();
  sleepPop.classList.add('open');
});
document.getElementById('npSleep').addEventListener('click', function (e) {
  e.stopPropagation();
  sleepPop.classList.toggle('open');
});
document.addEventListener('click', function (e) {
  if (!sleepPop.contains(e.target)) sleepPop.classList.remove('open');
  var sm = document.getElementById('settingsMenu');
  if (!sm.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) sm.classList.remove('open');
});

/* scrubbers — pointer drag */
function bindScrub(el) {
  var dragging = false;
  function seekTo(clientX) {
    if (!current) return;
    var r = el.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    var dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : findItem(current).dur;
    audio.currentTime = frac * dur;
    updateUI();
  }
  el.addEventListener('pointerdown', function (e) {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    seekTo(e.clientX);
    e.preventDefault();
  });
  el.addEventListener('pointermove', function (e) { if (dragging) seekTo(e.clientX); });
  el.addEventListener('pointerup', function () { dragging = false; recordPosition(); });
  el.addEventListener('pointercancel', function () { dragging = false; });
  el.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { skip(-15); e.preventDefault(); }
    if (e.key === 'ArrowRight') { skip(30); e.preventDefault(); }
  });
}
bindScrub(document.getElementById('barScrub'));
bindScrub(document.getElementById('npScrub'));

/* expand / collapse */
function openNowPlaying() {
  if (!current) return;
  npEl.classList.add('open');
  document.body.classList.add('expanded');
  updateUI();
}
function closeNowPlaying() {
  npEl.classList.remove('open');
  document.body.classList.remove('expanded');
  sleepPop.classList.remove('open');
}
document.getElementById('playerInfo').addEventListener('click', openNowPlaying);
document.getElementById('npCollapse').addEventListener('click', closeNowPlaying);

/* keyboard */
document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === ' ') {
    if (e.target && (e.target.tagName === 'BUTTON' || e.target.getAttribute('role') === 'slider')) return;
    if (!current) return;
    togglePlay();
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' && (!e.target || e.target.getAttribute('role') !== 'slider')) {
    skip(-15);
  } else if (e.key === 'ArrowRight' && (!e.target || e.target.getAttribute('role') !== 'slider')) {
    skip(30);
  } else if (e.key === 'Escape' && npEl.classList.contains('open')) {
    closeNowPlaying();
  }
});

/* settings */
var settingsBtn = document.getElementById('settingsBtn');
settingsBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  document.getElementById('settingsMenu').classList.toggle('open');
});
document.getElementById('clearHistory').addEventListener('click', function () {
  store = {};
  saveStore(store);
  Object.keys(cardEls).forEach(function (id) {
    var el = cardEls[id];
    el.fill.style.width = '0';
    el.check.innerHTML = '';
    var it = findItem(id);
    if (it && it.audioUrl && !it._failed) el.badge.innerHTML = '';
  });
  updateContinue();
  document.getElementById('settingsMenu').classList.remove('open');
});

})();
</script>
